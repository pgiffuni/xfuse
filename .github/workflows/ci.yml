name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - freebsd_version: "14.5"
            rust_version: "1.90.0"
          - freebsd_version: "15.1"
            rust_version: "nightly"
    name: FreeBSD ${{ matrix.freebsd_version }} ${{ matrix.rust_version }}
    steps:
      - uses: actions/checkout@v6
      - name: Start VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.freebsd_version }}
          usesh: true
      - name: Install dependencies
        shell: freebsd {0}
        run: |
          pkg install -y curl fusefs-libs pkgconf
          kldload fusefs
          fetch https://sh.rustup.rs -o rustup.sh
          sh rustup.sh -y --profile=minimal --default-toolchain ${{ matrix.rust_version }}
      - name: Build
        shell: freebsd {0}
        run: |
          . $HOME/.cargo/env
          cargo build --all-targets
      - name: Test
        shell: freebsd {0}
        run: |
          . $HOME/.cargo/env
          cargo test
      - name: No test is registered twice
        shell: freebsd {0}
        run: |
          . $HOME/.cargo/env
          # A duplicated `#[test]` registers one test twice and hides that another
          # never runs, and the *count* cannot tell you: it goes up by one and
          # looks fine.  Only the names can.  This has happened in this repository
          # twice, once with a test silently disabled behind it.
          listed=$(cargo test --bins -- --list 2>/dev/null | grep ': test$')
          total=$(printf '%s\n' "$listed" | grep -c .)
          unique=$(printf '%s\n' "$listed" | sort -u | grep -c .)
          if [ "$total" != "$unique" ]; then
            echo "a test is registered more than once:"
            printf '%s\n' "$listed" | sort | uniq -d
            exit 1
          fi
          echo "$unique tests, each registered once"
      - name: Benchmark
        shell: freebsd {0}
        run: |
          . $HOME/.cargo/env
          cargo test --bench read-amplification
      - name: Clippy
        if: matrix.rust_version == 'nightly'
        shell: freebsd {0}
        run: |
          . $HOME/.cargo/env
          rustup component add clippy
          cargo clippy --all-targets -- -D warnings
      - name: Audit
        if: matrix.rust_version == 'nightly'
        shell: freebsd {0}
        run: |
          . $HOME/.cargo/env
          pkg install -y cargo-audit
          cargo audit
      - name: Minver
        if: matrix.rust_version == 'nightly'
        shell: freebsd {0}
        run: |
          . $HOME/.cargo/env
          cargo update -Zdirect-minimal-versions
          cargo check --all-targets
      - name: Fmt
        if: matrix.rust_version == 'nightly'
        shell: freebsd {0}
        run: |
          . $HOME/.cargo/env
          rustup component add rustfmt
          cargo fmt -- --check --color=never
